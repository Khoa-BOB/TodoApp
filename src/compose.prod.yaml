name: todoapp-prod

services:
  api:
    # Built and pushed by GitHub Actions (.github/workflows/ci.yml).
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/todoapp-api:latest"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # Only Caddy publishes ports; accept its forwarded HTTPS scheme.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "Data Source=/data/app.db"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY to a strong production signing key}"
      Jwt__Issuer: "TodoApp.Api"
      Jwt__Audience: "TodoApp.Client"
      Jwt__ExpiryMinutes: "15"
    volumes:
      - sqlite_prod_data:/data
    restart: unless-stopped

  web:
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/todoapp-web:latest"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN to your public hostname}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlite_prod_data:
  caddy_data:
  caddy_config:
