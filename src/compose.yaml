services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Data Source=/data/app.db"
    volumes:
      - .:/app
      - sqlite_data:/data

  frontend:
    build:
      context: ./TodoApp.Web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      API_URL: "http://api:8080"
    depends_on:
      - api

volumes:
  sqlite_data:
