# The name shown in the "Actions" tab on GitHub.
name: CI

# "on" = WHEN this workflow runs.
on:
  push:
    branches: [main]   # every push/merge to main -> test, build AND push images
  pull_request:
    branches: [main]   # every PR into main -> test and build only (no push)

# A workflow is made of "jobs". Each job runs on a fresh virtual machine (a "runner").
jobs:
  # ---------------------------------------------------------------------------
  # Job 1: make sure the code compiles before we bother building images.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest   # the type of machine GitHub gives us
    steps:
      # Download your repository's code onto the runner.
      - uses: actions/checkout@v4

      # Install the .NET SDK (same version as your Dockerfile: 10.0).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Compile the API. If there's a compile error, the job fails here.
      - name: Build API
        run: dotnet build src/TodoApp.Api/TodoApp.Api.csproj -c Release

      # Install Node.js (same version as your web Dockerfile: 22).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install packages and build the React app.
      # "working-directory" = run these commands inside that folder.
      - name: Build Web
        working-directory: src/TodoApp.Web
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # Job 2: build the Docker images and push them to Docker Hub.
  # ---------------------------------------------------------------------------
  docker:
    needs: test              # only start if the "test" job passed
    runs-on: ubuntu-latest

    # "matrix" runs this job twice in parallel: once per item in the list.
    # Inside the steps, ${{ matrix.name }}, ${{ matrix.context }} etc. change per run.
    strategy:
      matrix:
        include:
          - name: todoapp-api
            context: src                      # folder Docker builds from
            file: src/Dockerfile.prod         # which Dockerfile to use
          - name: todoapp-web
            context: src/TodoApp.Web
            file: src/TodoApp.Web/Dockerfile.prod

    steps:
      - uses: actions/checkout@v4

      # Buildx = Docker's modern builder. Needed for the build cache below.
      - uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub using secrets you store in the GitHub repo settings.
      # Skipped on pull requests: we don't push from PRs.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the image, and push it only when this is a push to main.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          # Two tags per image:
          #   latest      -> always points to the newest build
          #   <commit sha> -> lets you pull/roll back to an exact version
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ github.sha }}
          # Reuse layers from previous runs so builds are faster.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
