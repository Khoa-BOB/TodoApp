# The name shown in the "Actions" tab on GitHub.
name: CI

# "on" = WHEN this workflow runs.
on:
  push:
    branches: [main]   # every push/merge to main -> test, build AND push images
  pull_request:
    branches: [main]   # every PR into main -> test and build only (no push)

# A workflow is made of "jobs". Each job runs on a fresh virtual machine (a "runner").
jobs:
  # ---------------------------------------------------------------------------
  # Job 1: make sure the code compiles before we bother building images.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest   # the type of machine GitHub gives us
    steps:
      # Download your repository's code onto the runner.
      - uses: actions/checkout@v4

      # Install the .NET SDK (same version as your Dockerfile: 10.0).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Compile the API. If there's a compile error, the job fails here.
      - name: Build API
        run: dotnet build src/TodoApp.Api/TodoApp.Api.csproj -c Release

      # Install Node.js (same version as your web Dockerfile: 22).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install packages and build the React app.
      # "working-directory" = run these commands inside that folder.
      - name: Build Web
        working-directory: src/TodoApp.Web
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # Job 2: build the Docker images and push them to Docker Hub.
  # ---------------------------------------------------------------------------
  docker:
    needs: test              # only start if the "test" job passed
    runs-on: ubuntu-latest

    # "matrix" runs this job twice in parallel: once per item in the list.
    # Inside the steps, ${{ matrix.name }}, ${{ matrix.context }} etc. change per run.
    strategy:
      matrix:
        include:
          - name: todoapp-api
            context: src                      # folder Docker builds from
            file: src/Dockerfile.prod         # which Dockerfile to use
          - name: todoapp-web
            context: src/TodoApp.Web
            file: src/TodoApp.Web/Dockerfile.prod

    steps:
      - uses: actions/checkout@v4

      # Buildx = Docker's modern builder. Needed for the build cache below.
      - uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub using secrets you store in the GitHub repo settings.
      # Skipped on pull requests: we don't push from PRs.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the image, and push it only when this is a push to main.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          # Two tags per image:
          #   latest      -> always points to the newest build
          #   <commit sha> -> lets you pull/roll back to an exact version
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ github.sha }}
          # Reuse layers from previous runs so builds are faster.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------------------------------------------------------------------------
  # Job 3: tell the GCP VM to download the new images and restart the app.
  # ---------------------------------------------------------------------------
  deploy:
    needs: docker                          # only after both images were pushed
    if: github.event_name == 'push'        # never deploy from a pull request
    runs-on: ubuntu-latest
    concurrency: deploy                    # if two pushes land close together, deploy one at a time

    # "id-token: write" lets this job ask GitHub for a short-lived login token,
    # which GCP accepts instead of a password/key (Workload Identity Federation).
    permissions:
      contents: read
      id-token: write

    # Plain settings (not secrets) used by the gcloud commands below.
    # Set them in GitHub: Settings -> Secrets and variables -> Actions -> Variables.
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT }}   # gcloud reads this as --project
      CLOUDSDK_COMPUTE_ZONE: ${{ vars.GCP_ZONE }}      # gcloud reads this as --zone

    steps:
      - uses: actions/checkout@v4

      # Log in to Google Cloud as the "todoapp-deployer" service account.
      # Both values come from `tofu output` (see src/infra/gcp/README.md).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Install the gcloud command-line tool.
      - uses: google-github-actions/setup-gcloud@v2

      # Copy the latest compose file to the VM. The VM has no public SSH port,
      # so we go through Google's IAP tunnel. --quiet = don't ask questions,
      # e.g. auto-create an SSH key the first time.
      - name: Upload compose file
        run: |
          gcloud compute scp src/compose.prod.yaml todoapp:~/compose.prod.yaml \
            --tunnel-through-iap --quiet

      # Run commands on the VM:
      #   1. move the compose file into the app folder (/opt/todoapp, where .env lives)
      #   2. pull the new images from Docker Hub
      #   3. recreate only the containers whose image changed
      #   4. delete old images so the disk doesn't fill up
      # "set -e" = stop at the first failing command, which makes this step fail.
      - name: Deploy on VM
        run: |
          gcloud compute ssh todoapp --tunnel-through-iap --quiet --command '
            set -e
            sudo install -m 0644 ~/compose.prod.yaml /opt/todoapp/compose.prod.yaml
            cd /opt/todoapp
            sudo docker compose -f compose.prod.yaml pull
            sudo docker compose -f compose.prod.yaml up -d --remove-orphans
            sudo docker image prune -f
            sudo docker compose -f compose.prod.yaml ps
          '
